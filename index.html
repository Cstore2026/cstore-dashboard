<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Store Delivery Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loginScreen" class="login">
    <div class="login-card card">
      <div class="brand">
        <img src="assets/logo.png" class="logo-img" alt="C Store Delivery Logo" onerror="this.style.display='none'">
        <h1>C Store Delivery Dashboard</h1>
        <p>لوحة متابعة الدليفري والكول سنتر والفروع</p>
      </div>
      <label>اللغة
        <select id="loginLang" onchange="setLang(this.value)">
          <option value="ar">عربي</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>Username<input id="loginUser" autocomplete="off"></label>
      <label>Password<input id="loginPass" type="password" autocomplete="new-password"></label>
      <button class="pink full" onclick="login()">دخول</button>
      <div id="loginError" class="note hidden">بيانات الدخول غير صحيحة</div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="topbar">
      <div class="top-inner">
        <div class="row">
          <img src="assets/logo.png" class="logo-top" alt="logo" onerror="this.style.display='none'">
          <div>
            <div id="mainBrandTitle" class="title">C Store Delivery Dashboard</div>
            <div id="userTitle" class="muted"></div>
          </div>
        </div>
        <div class="row">
          <select id="topLang" onchange="setLang(this.value)">
            <option value="ar">عربي</option>
            <option value="en">English</option>
          </select>
          <button class="light" onclick="logout()">خروج</button>
        </div>
      </div>
    </div>
    <main class="page">
      <div id="tabs" class="tabs"></div>
      <div id="content"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js?v=clean-final-1"></script>
</body>
</html>
