<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Store Delivery Dashboard</title>

</head>
<body>
<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="brand">
      <div class="logo"><img class="logo-img logo-login" src="/assets/logo.png" alt="C Store Delivery Logo"></div>
      <h1>C Store Delivery Dashboard</h1>
      <p data-t="loginSub">لوحة موحدة للدليفري والكول سنتر والفروع</p>
    </div>
    <div class="grid g2">
      <label><span data-t="language">اللغة</span><select id="loginLang" onchange="setLang(this.value)"><option value="ar">عربي</option><option value="en">English</option></select></label>
          </div>
    <label>Username<input id="loginUser" autocomplete="off"></label>
    <label>Password<input id="loginPass" type="password" autocomplete="new-password"></label>
    <button class="pink full" onclick="login()" data-t="login">دخول</button>
    <div id="loginError" class="note hidden" style="margin-top:12px" data-t="badLogin">بيانات الدخول غير صحيحة</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar"><div class="top-inner">
    <div class="row"><div class="logo" style="margin:0"><img class="logo-img logo-top" src="/assets/logo.png" alt="C Store Delivery Logo"></div><div><div id="mainBrandTitle" class="title">C Store Delivery Dashboard</div><div id="userTitle" class="muted">-</div></div></div>
    <div class="row"><select id="topLang" style="width:140px" onchange="setLang(this.value)"><option value="ar">عربي</option><option value="en">English</option></select><button class="outline" onclick="logout()" data-t="logout">خروج</button></div>
  </div></div>
  <main class="page">
    <div id="tabs" class="tabs"></div>
    <div id="content"></div>
  </main>
</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
